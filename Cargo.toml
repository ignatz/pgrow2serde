# Fork of https://github.com/deknowny/pgrow2serde.
[package]
name = "trailbase-pgrow2serde"
description = "Easily deserialize postgres rows"
license = "MIT/Apache-2.0"
homepage = "https://github.com/deknowny/pgrow2serde"
repository = "https://github.com/deknowny/pgrow2serde"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.4.29", default-features = false }
serde = { version = "1.0.171", default-features = false, features = ["derive", "std"] }
tokio-postgres = { version = "0.7.8", default-features = false }

[dev-dependencies]
postgres = "0.19.5"
tokio = { version = "1.29.1", features = ["macros", "rt-multi-thread"] }
